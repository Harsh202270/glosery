<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grocery Store</title>

<style>
body{
  margin:0;
  font-family:'Segoe UI',Arial;
  background:linear-gradient(120deg,#f1fdf3,#e8f6ff);
}
header{
  background:#0aad0a;
  color:white;
  padding:14px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  box-shadow:0 5px 15px rgba(0,0,0,.15);
}
header h1{margin:0;font-size:22px;}
header input{
  padding:10px 14px;
  border-radius:30px;
  border:none;
  width:230px;
  outline:none;
}
.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  padding:25px;
  max-width:1200px;
  margin:auto;
}
.card{
  background:white;
  border-radius:15px;
  padding:12px;
  box-shadow:0 10px 25px rgba(0,0,0,.12);
  position:relative;
}
.card img{
  width:100%;
  height:160px;
  object-fit:cover;
  border-radius:12px;
}
.fav-icon{
  position:absolute;
  top:10px;
  right:10px;
  font-size:22px;
  cursor:pointer;
}
.fav-icon.active{color:red;}
.price{color:#0aad0a;font-weight:bold;}
.old{text-decoration:line-through;color:#888;}
.discount{
  background:red;color:white;
  font-size:12px;padding:3px 6px;
  border-radius:12px;
}
.btn{
  margin-top:10px;
  background:#0aad0a;
  color:white;
  padding:8px;
  border-radius:20px;
  text-align:center;
  cursor:pointer;
}
.menu{
  position:absolute;
  top:55px;
  right:20px;
  background:black;
  color:white;
  display:none;
  flex-direction:column;
  border-radius:10px;
}
.menu div{
  padding:12px 18px;
  cursor:pointer;
}
.menu div:hover{background:#444;}
</style>
</head>

<header>
  <h1>🛒 Grocery Store</h1>
  <div style="display:flex;gap:10px;align-items:center">
    <input type="text" id="searchBar" placeholder="Search..." onkeyup="searchProducts()">
    <div onclick="goToCart()">🛒</div>
    <div onclick="openHeaderMenu(event)">⋮</div>
  </div>

  <div id="menuBox" class="menu">
    <div onclick="goWishlist()">❤️ Wishlist</div>
    <div onclick="goOrders()">📦 My Orders</div>
    <div onclick="goProfile()">👤 My Profile</div>
  </div>
</header>

<div class="products" id="productList"></div>

const list=document.getElementById("productList");

function renderProducts(filter=""){
  list.innerHTML="";
  const wishlist=JSON.parse(localStorage.getItem("wishlist")||"[]");

  products.filter(p=>p.name.toLowerCase().includes(filter.toLowerCase()))
  .forEach(p=>{
    const card=document.createElement("div");
    card.className="card";
    const fav=wishlist.includes(p.id);

    card.innerHTML=`
      <span class="fav-icon ${fav?"active":""}"
        onclick="toggleFavorite(event,${p.id})">
        ${fav?"❤️":"🤍"}
      </span>
      <img src="${p.images[0]}">
      <h3>${p.name}</h3>
      <div class="old">${p.old}</div>
      <div class="price">${p.price} <span class="discount">SALE</span></div>
      <div class="btn">View</div>
    `;
    list.appendChild(card);
  });
}

function toggleFavorite(e,id){
  e.stopPropagation();
  let w=JSON.parse(localStorage.getItem("wishlist")||"[]");
  w=w.includes(id)?w.filter(x=>x!==id):[...w,id];
  localStorage.setItem("wishlist",JSON.stringify(w));
  renderProducts(searchBar.value);
}

function openHeaderMenu(e){
  e.stopPropagation();
  const m=document.getElementById("menuBox");
  m.style.display=m.style.display==="flex"?"none":"flex";
}

document.addEventListener("click",()=>menuBox.style.display="none");

function searchProducts(){renderProducts(searchBar.value);}
function goWishlist(){location.href="wishlist.html";}
function goOrders(){location.href="orders.html";}
function goProfile(){location.href="profile.html";}
function goToCart(){location.href="cart.html";}

/* ✅ FIXED CALL */

</script>
