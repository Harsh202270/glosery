<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Wishlist</title>

<style>
body{
  margin:0;
  font-family:'Segoe UI',Arial;
  background:linear-gradient(120deg,#f1fdf3,#e8f6ff);
}
header{
  background:#0aad0a;
  color:white;
  padding:15px;
  text-align:center;
  font-size:22px;
  font-weight:bold;
}


.header-bar{
  display:flex;
  align-items:center;
}
.back-btn{
  background:white;
  color:#0aad0a;
  padding:6px 14px;
  border-radius:20px;
  font-size:14px;
  cursor:pointer;
  font-weight:600;
  margin-right:15px;
}
.back-btn:hover{
  background:#e9f7ef;
}
.header-title{
  flex:1;
  text-align:center;
}


.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  padding:25px;
  max-width:1200px;
  margin:auto;
}
.card{
  background:white;
  border-radius:15px;
  padding:12px;
  box-shadow:0 10px 25px rgba(0,0,0,.12);
  cursor:pointer;
}
.card img{
  width:100%;
  height:160px;
  object-fit:cover;
  border-radius:12px;
}
.card h3{
  margin:10px 0 5px;
}
.price{
  color:#0aad0a;
  font-weight:bold;
  font-size:18px;
}
.btn{
  margin-top:10px;
  background:#ff5252;
  color:white;
  padding:8px;
  border-radius:20px;
  text-align:center;
  cursor:pointer;
}
</style>
</head>

<body>

<header>
  <div class="header-bar">
    <div class="back-btn" href="javascript:void(0)" onclick="history.back()">← Back</div>
    <div class="header-title">❤️ My Wishlist</div>
  </div>
</header>


<div class="products" id="wishlist"></div>

<script>
async function loadWishlist(){
  const res = await fetch("products.py");
  const data = await res.json();

  const wishlistIds = JSON.parse(localStorage.getItem("wishlist") || "[]");
  const list = document.getElementById("wishlist");

  list.innerHTML = "";

  if(wishlistIds.length === 0){
    list.innerHTML = "<h3>No items in wishlist ❤️</h3>";
    return;
  }

  data.products
    .filter(p => wishlistIds.includes(p.id))
    .forEach(p=>{
      const div = document.createElement("div");
      div.className = "card";
      div.onclick = () => openProduct(p.id);

      div.innerHTML = `
        <img src="${p.images[0]}">
        <h3>${p.name}</h3>
        <div class="price">${p.price}</div>
        <div class="btn" onclick="event.stopPropagation(); removeItem(${p.id})">
          Remove
        </div>
      `;

      list.appendChild(div);
    });
}

function removeItem(id){
  let wishlist = JSON.parse(localStorage.getItem("wishlist") || "[]");
  wishlist = wishlist.filter(x => x !== id);
  localStorage.setItem("wishlist", JSON.stringify(wishlist));
  loadWishlist();
}

function openProduct(id){
  window.location.href = "product.html?id=" + id;
}

loadWishlist();
</script>

</body>
</html>
